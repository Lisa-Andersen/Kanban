name: Continuous integration

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect changed projects.
  # It reads the commits, and looks where changes were made.
  changes:
    name: Detect changed projects (Ubuntu only)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'KanbanBackend/**'
              - '.github/workflows/github-action-CI.yml'
            frontend:
              - 'KanBanFrontend/**'
              - '.github/workflows/github-action-CI.yml'

      - name: Report pushed commit
        if: github.event_name == 'push'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          echo "$ACTOR is pushing commit: $COMMIT_TITLE"

  # Runs dotnet tests when the changes happened in the backend project.        
  backend:
    name: Backend tests on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run solution tests
        run: dotnet test KanbanBackend/KanbanBackend.slnx --configuration Release

  # Runs linting and build for the frontend project when the changes happened in the frontend project.
  frontend:
    name: Frontend checks on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KanBanFrontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: KanBanFrontend

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
